[project]
name = "smart-meeting"
version = "0.1.0"
description = "Local meeting capture, transcription (faster-whisper) and analysis (Ollama)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "platformdirs>=4.12.2",
    "pyaudiowpatch>=0.2.12.8 ; sys_platform == 'win32'",
    "pydantic-settings>=2.15.0",
    "pyobjc-framework-coremedia>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-screencapturekit>=12.2.2 ; sys_platform == 'darwin'",
    "python-multipart>=0.0.32",
    "sounddevice>=0.5.6 ; sys_platform == 'darwin'",
    "soxr>=1.1.0",
    "uvicorn[standard]>=0.54.0",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
# CUDA 12 runtime libraries required by CTranslate2 on GPU, preloaded at startup.
# No macOS wheels exist: the extra installs nothing there.
cuda = [
    "nvidia-cublas-cu12>=12.9.2.10; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
]

[project.scripts]
smart-meeting = "smart_meeting.launcher:run"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
