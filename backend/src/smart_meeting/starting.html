<!doctype html>
<!-- Page opened by the launcher as soon as the app is clicked, before the server answers: it shows
     that Smart Meeting is starting, then goes to the app once its icon loads from the server.
     Its placeholders are filled by launcher.write_starting_page. -->
<html lang="$lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f7fb; --fg: #1a1b25; --muted: #5c5f73; --accent: #3b5bdb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1a1b1e; --fg: #e9ecef; --muted: #a6a7ab; --accent: #748ffc; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font-family: system-ui, sans-serif; text-align: center; }
    main { padding: 16px; max-width: 420px; }
    .spinner { width: 40px; height: 40px; margin: 0 auto 24px; border-radius: 50%;
      border: 4px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent);
      animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0; line-height: 1.5; }
    #slow { display: none; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>$title</h1>
    <p>$detail</p>
    <p id="slow" role="status">$slow</p>
  </main>
  <script>
    // A file page cannot read the API (other origin), but it can load an image from it: the icon
    // answers as soon as the server serves the interface.
    const app = '$url';
    const started = Date.now();
    const probe = () => {
      const image = new Image();
      image.onload = () => location.replace(app);
      image.onerror = () => {
        if (Date.now() - started > 30000) document.getElementById('slow').style.display = 'block';
        setTimeout(probe, 300);
      };
      image.src = app + 'favicon.svg?' + Date.now();
    };
    probe();
  </script>
</body>
</html>
