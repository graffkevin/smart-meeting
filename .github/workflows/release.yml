# Release packages, built on GitHub from a v* tag: a release is made from any computer with
# `make release` (tag of the version, pushed), even from Linux for the Mac app.
#
# - the release of the tag is created as a draft when there is none (notes written by hand, then
#   published), an existing one (draft or published) gets the files;
# - Linux: the GNOME app package (packaging/linux/build-deb.sh) on Ubuntu;
# - Windows: the installer of the app (packaging/windows/build.sh) on Windows, installed and started
#   there before being added (not signed: Windows SmartScreen asks to confirm the first launch);
# - macOS: the disk image (packaging/macos/build.sh) on a GitHub Mac, signed with the Developer ID and
#   notarized. Without the signing secrets it only gets an ad hoc signature, which macOS refuses to
#   open once downloaded: it is then kept as an artifact of the run, never added to a release.
#
# Secrets (Settings > Secrets and variables > Actions), stored once by packaging/macos/ci-secrets.sh:
#   MACOS_CERTIFICATE           the "Developer ID Application" certificate and its key, .p12 in base64
#   MACOS_CERTIFICATE_PASSWORD  password of the .p12
#   APPLE_ID                    Apple account of the developer team
#   APPLE_APP_PASSWORD          app-specific password of that account (notarization)
#   APPLE_TEAM_ID               team ID (10 characters)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and add to its release (e.g. v0.2.4); empty: main, artifacts only"
        required: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release of the tag
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # gh release view finds drafts too: one release per tag, whoever creates it first
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --verify-tag --title "Smart Meeting ${TAG#v}" --notes ""

  deb:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: oven-sh/setup-bun@v2

      - name: Build
        run: packaging/linux/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Meeting-deb
          path: build/linux/smart-meeting_*_all.deb
          retention-days: 14

      - name: Add to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb="$(ls build/linux/smart-meeting_*_all.deb)"
          sha256sum "$deb"
          gh release upload "$TAG" "$deb" --clobber

  exe:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: astral-sh/setup-uv@v6

      - uses: oven-sh/setup-bun@v2

      - name: Inno Setup
        run: |
          [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup -y --no-progress

      - name: Build
        run: packaging/windows/build.sh

      - name: Install and start it
        shell: pwsh
        run: |
          $version = (Select-String -Path backend/pyproject.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $setup = Get-ChildItem build/windows/Smart-Meeting-Setup-*.exe
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Smart Meeting\Smart Meeting.exe"
          $log = "$env:LOCALAPPDATA\smart-meeting\server.log"
          # The window's libraries (WebView2 through .NET) load from the bundle
          $test = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Window libraries: exit code $($test.ExitCode)" }
          # The server of the installed app answers, serves the interface and knows its version
          $server = Start-Process $exe -ArgumentList '--server', '--no-window', '--port', '8499' -PassThru
          $health = $null
          for ($i = 0; $i -lt 90 -and -not $health; $i++) {
            Start-Sleep -Seconds 2
            try { $health = Invoke-RestMethod http://127.0.0.1:8499/api/health } catch {}
          }
          try {
            if (-not $health) { throw "The server does not answer" }
            $page = Invoke-WebRequest http://127.0.0.1:8499/ -UseBasicParsing
            if ($page.Content -notmatch 'id="root"') { throw "No web interface" }
            $update = Invoke-RestMethod http://127.0.0.1:8499/api/update
            if ($update.current -ne $version) { throw "Version $($update.current), expected $version" }
            Write-Output "Smart Meeting $version installed and running"
          } finally {
            try { Invoke-RestMethod -Method Post http://127.0.0.1:8499/api/shutdown | Out-Null } catch {}
            $server | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
            if (Test-Path $log) { Get-Content $log -Tail 40 }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Meeting-exe
          path: build/windows/Smart-Meeting-Setup-*.exe
          retention-days: 14

      - name: Add to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe="$(ls build/windows/Smart-Meeting-Setup-*.exe)"
          sha256sum "$exe"
          gh release upload "$TAG" "$exe" --clobber

  dmg:
    needs: release
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
          fetch-depth: 0 # the build number is the number of commits

      - uses: astral-sh/setup-uv@v6

      - name: XcodeGen
        run: brew install xcodegen

      - name: Signing keychain
        id: signing
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "::warning::No MACOS_CERTIFICATE secret: ad hoc signature, the image will not open on other Macs (packaging/macos/ci-secrets.sh)"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }
          echo "developer_id=$identity" >> "$GITHUB_OUTPUT"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            xcrun notarytool store-credentials smart-meeting --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "notary_profile=smart-meeting" >> "$GITHUB_OUTPUT"
            echo "team=$APPLE_TEAM_ID" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No notarization secrets: signed but not notarized"
          fi

      - name: Build
        env:
          DEVELOPER_ID: ${{ steps.signing.outputs.developer_id }}
          NOTARY_PROFILE: ${{ steps.signing.outputs.notary_profile }}
          TEAM: ${{ steps.signing.outputs.team || 'S9DDJTM2UJ' }}
        run: packaging/macos/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Meeting-dmg
          path: build/macos/Smart-Meeting-*.dmg
          retention-days: 14

      - name: Add to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="$(ls build/macos/Smart-Meeting-*.dmg)"
          shasum -a 256 "$dmg"
          # Only an image every Mac opens: notarized, its ticket stapled
          if ! xcrun stapler validate "$dmg" >/dev/null 2>&1; then
            echo "::error::The disk image is not notarized: not added to the release (secrets: packaging/macos/ci-secrets.sh). It is in the artifacts of the run."
            exit 1
          fi
          gh release upload "$TAG" "$dmg" --clobber

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
