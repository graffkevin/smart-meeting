# Xcode project of the macOS app, generated by XcodeGen: `xcodegen` in this folder writes
# SmartMeeting.xcodeproj (not versioned). packaging/macos/build.sh does it before building.
name: SmartMeeting
options:
  bundleIdPrefix: com.graffkevin
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  SmartMeeting:
    type: application
    platform: macOS
    sources:
      - path: SmartMeeting
    settings:
      base:
        PRODUCT_NAME: Smart Meeting
        # Apple silicon only, like the bundled server and Ollama
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: com.graffkevin.smartmeeting
        INFOPLIST_FILE: SmartMeeting/Info.plist
        CODE_SIGN_ENTITLEMENTS: SmartMeeting/SmartMeeting.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Ad hoc signature for local builds; build.sh signs with the Developer ID
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # The script below reads the server built next to the repository
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Embed the server
        script: '"$SRCROOT/../packaging/macos/embed-server.sh"'
        basedOnDependencyAnalysis: false
